<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tickets | Support Queue</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; font-family: Arial, sans-serif; color: #243442; }
      body { overflow: hidden; background: #f4f6f8; }
      button, input { font: inherit; }
      [data-test-id="hs-global-toolbar"] { position: fixed; inset: 0 0 auto 0; z-index: 10; display: flex; align-items: center; gap: 18px; height: 44px; padding: 0 20px; background: #2e2e2e; color: white; }
      [data-test-id="global-search-input-react"] { width: min(550px, 46vw); height: 32px; padding: 0 14px; border: 1px solid #8a8a8a; background: transparent; color: white; }
      [data-test-id="hs-vertical-nav"] { position: fixed; inset: 44px auto 0 0; z-index: 9; width: var(--global-nav-vertical-nav-width, 236px); padding: 14px 12px; background: #303030; color: white; transition: width 160ms ease; }
      [data-test-id="hs-vertical-nav"] a { display: block; margin-bottom: 6px; padding: 10px 12px; color: white; text-decoration: none; }
      [data-test-id="hs-vertical-nav"] a[aria-current="page"] { background: #686868; }
      main { position: fixed; inset: 44px 0 0 var(--global-nav-vertical-nav-width, 236px); padding: 16px; transition: left 160ms ease; }
      .page-card { display: flex; flex-direction: column; height: 100%; overflow: hidden; border: 1px solid #d6dce1; border-radius: 12px; background: white; }
      .titlebar { display: flex; align-items: center; justify-content: space-between; min-height: 60px; padding: 0 24px; }
      .titlebar h1 { margin: 0; font-size: 24px; }
      [data-test-id="view-tabs-container-lite"] { display: flex; align-items: end; height: 44px; padding: 0 24px; }
      [data-test-id="view-tab-menu"] { padding: 9px 12px; border-bottom: 2px solid #33475b; }
      [data-test-id="crm-lite-toolbar-wrapper"] { display: grid; gap: 8px; padding: 12px 24px; }
      [data-test-id="toolbar"], [data-test-id="quick-filters"] { display: flex; align-items: center; gap: 8px; }
      [data-test-id="toolbar"] button, [data-test-id="quick-filters"] button { min-height: 32px; padding: 0 12px; border: 1px solid #aeb8c2; background: white; }
      [data-test-id="compact-toolbar-search-input"] { width: 228px; height: 32px; padding: 0 12px; border: 1px solid #c4ccd4; }
      [data-test-id="data-well"] { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 10px 24px; }
      [data-test-id="report-card-v2"] { min-height: 102px; padding: 14px; border: 1px solid #cbd2d9; border-radius: 10px; }
      .metric-label { margin-bottom: 8px; color: #647486; font-size: 12px; }
      .metric-value { font-size: 24px; font-weight: 700; }
      [data-test-id="framework-data-table-container"] { display: flex; flex: 1; min-height: 0; flex-direction: column; padding: 0 24px; }
      [data-test-id="fdt-scroll-window"] { flex: 1; min-height: 0; overflow: auto; }
      table { width: 100%; border-collapse: collapse; table-layout: fixed; }
      th, td { height: 40px; padding: 0 12px; border-bottom: 1px solid #d8dde3; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      th:first-child, td:first-child { width: 46px; text-align: center; }
      th:nth-child(2) { width: 48%; }
      th:nth-child(3) { width: 19%; }
      th:nth-child(4) { width: 22%; }
      th { background: white; font-size: 12px; }
      td a { color: #006b73; font-weight: 600; text-decoration: none; }
      [data-test-id="table-paginator"] { display: flex; align-items: center; justify-content: center; height: 48px; gap: 18px; }
      .bottom-bar { display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 24px; border-top: 1px solid #d8dde3; }
    </style>
  </head>
  <body>
    <header data-test-id="hs-global-toolbar">
      <strong>Support Workspace</strong>
      <input data-test-id="global-search-input-react" aria-label="Global search" placeholder="Find or ask">
      <span>Operations</span>
    </header>
    <nav data-test-id="hs-vertical-nav" aria-label="Main navigation">
      <a href="#">Home</a>
      <a href="#">CRM</a>
      <a href="#">Marketing</a>
      <a href="#">Content</a>
      <a href="#">Sales</a>
      <a href="#" aria-current="page">Service</a>
      <a href="#">Automation</a>
      <a href="#">Reporting</a>
    </nav>
    <main>
      <section class="page-card">
        <header class="titlebar" role="banner">
          <h1>Tickets</h1>
          <button type="button" style="background:#ff7a59;color:#fff;border-color:#ff7a59">Add tickets</button>
        </header>
        <div data-test-id="view-tabs-container-lite">
          <div data-test-id="view-tab-menu">Support Queue</div>
        </div>
        <div data-test-id="crm-lite-toolbar-wrapper">
          <div data-test-id="toolbar">
            <div data-test-id="compact-toolbar-search"><input data-test-id="compact-toolbar-search-input" aria-label="Search tickets" placeholder="Search tickets"></div>
            <button type="button" data-test-id="compact-toolbar-filter-toggle">Filter</button>
            <button type="button" data-test-id="toolbar-sort-button">Sort by</button>
            <span style="flex:1"></span>
            <button type="button" data-test-id="compact-toolbar-pipeline-switcher">Support Pipeline</button>
            <button type="button" data-test-id="compact-toolbar-settings-toggle">View settings</button>
          </div>
          <div data-test-id="quick-filters">
            <button type="button">Ticket owner</button>
            <button type="button">Create date</button>
            <button type="button">Last activity date</button>
            <button type="button">Priority</button>
            <button type="button">Advanced filters</button>
          </div>
        </div>
        <section data-test-id="data-well" aria-label="Queue analytics">
          <article data-test-id="report-card-v2"><div data-test-id="report-card-v2--card-wrapper"><div class="metric-label">Open tickets</div><div class="metric-value">146</div></div></article>
          <article data-test-id="report-card-v2"><div data-test-id="report-card-v2--card-wrapper"><div class="metric-label">Waiting on us</div><div class="metric-value">38</div></div></article>
          <article data-test-id="report-card-v2"><div data-test-id="report-card-v2--card-wrapper"><div class="metric-label">Waiting on contact</div><div class="metric-value">84</div></div></article>
          <article data-test-id="report-card-v2"><div data-test-id="report-card-v2--card-wrapper"><div class="metric-label">Closed today</div><div class="metric-value">27</div></div></article>
        </section>
        <div data-test-id="framework-data-table-container">
          <div data-test-id="fdt-scroll-window">
            <table data-test-id="framework-data-table">
              <thead><tr><th><input type="checkbox" aria-label="Select all tickets"></th><th>Ticket name</th><th>Create date</th><th>Ticket status</th><th>Owner</th></tr></thead>
              <tbody id="ticket-rows"></tbody>
            </table>
          </div>
          <nav data-test-id="table-paginator" aria-label="Ticket pages"><button type="button">Prev</button><strong>1</strong><span>2</span><span>3</span><button type="button">Next</button><span>100 per page</span></nav>
        </div>
        <div class="bottom-bar" data-test-id="viz-sync-footer"><strong>2,498 tickets</strong><div><button type="button">Export</button> <button type="button">Save</button></div></div>
      </section>
    </main>
    <script>
      const subjects = [
        "Acquisition workstation cannot reach detector",
        "Configure PACS destination for Northside Clinic",
        "Exposure index values need calibration review",
        "Portable system routing after network replacement",
        "Image transfer queue paused after maintenance",
        "Worklist fields not populating on new console",
        "Schedule remote session for viewer deployment",
        "Detector reports intermittent connection",
      ];
      const statuses = ["Waiting on us", "Waiting on contact", "Closed", "Open"];
      const body = document.getElementById("ticket-rows");
      for (let index = 0; index < 30; index += 1) {
        const id = 1000 + index;
        const row = document.createElement("tr");
        row.dataset.testId = `row-${id}`;
        row.innerHTML = `<td><input type="checkbox" aria-label="Select ticket ${id}"></td><td data-test-id="cell-0-5-subject-${id}"><a href="#">${subjects[index % subjects.length]}</a></td><td data-test-id="cell-0-5-createdate-${id}">Sep ${3 - (index % 3)}, 2026 ${8 + (index % 9)}:15 AM</td><td data-test-id="cell-0-5-hs_pipeline_stage-${id}">${statuses[index % statuses.length]}</td><td data-test-id="cell-0-5-hubspot_owner_id-${id}">Support Team</td>`;
        body.append(row);
      }
    </script>
  </body>
</html>
